name: Genboard
options:
  bundleIdPrefix: com.patlaplante
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Genboard:
    type: application
    platform: macOS
    sources: [Genboard]
    scheme:
      testTargets: [GenboardTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patlaplante.Genboard
        PRODUCT_NAME: Genboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Genboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
  GenboardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [GenboardTests]
    dependencies:
      - target: Genboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patlaplante.GenboardTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
